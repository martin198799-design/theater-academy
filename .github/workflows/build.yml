name: Autonomous Build & Sign Agent - From Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Complete Setup, Application ID, Keystore, PEM & API 36
        run: |
          python3 -c "
          import os
          import subprocess
          import shutil
          import re

          print('🤖 [AI Agent]: Initializing clean build and configuring SDK 36...')

          # 1. ضبط رقم الإصدار ليصبح 36 بدقة
          pubspec_path = 'pubspec.yaml'
          if os.path.exists(pubspec_path):
              with open(pubspec_path, 'r') as f:
                  pub_content = f.read()
              
              if 'version:' in pub_content:
                  pub_content = re.sub(r'version:\s+.*', 'version: 1.0.36+36', pub_content)
              
              with open(pubspec_path, 'w') as f:
                  f.write(pub_content)
              print('🤖 [AI Agent]: Version locked to 1.0.36+36.')

          # 2. التأكد من سلامة هيكل أندرويد بمعرف الحزمة الصحيح للمتجر
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              print('🤖 [AI Agent]: Recreating clean modern Android v2 template...')
              if os.path.exists('android'):
                  shutil.rmtree('android')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim.theater2028', '--project-name', 'academy99'], check=True)

          # 3. توليد مفتاح التوقيع الدائم والثابت
          os.makedirs('android/app', exist_ok=True)
          keystore_path = 'android/app/upload-keystore.jks'
          
          store_pass = 'theatre_arts_secure_2026'
          alias = 'upload'

          if not os.path.exists(keystore_path):
              print('🤖 [AI Agent]: Generating permanent signing keystore...')
              cmd = [
                  'keytool', '-genkey', '-v',
                  '-keystore', keystore_path,
                  '-alias', alias,
                  '-keyalg', 'RSA',
                  '-keysize', '2048',
                  '-validity', '10000',
                  '-storepass', store_pass,
                  '-keypass', store_pass,
                  '-dname', 'CN=Ibrahim, OU=TheatreArts, O=Ibrahim, L=Nasiriyah, C=IQ'
              ]
              subprocess.run(cmd, check=True)
          else:
              print('🤖 [AI Agent]: Keystore already exists. Preserving it safely.')

          # 4. استخراج شهادة الـ PEM المطلوبة لمتجر جوجل بلاي تلقائياً
          pem_path = 'upload_certificate.pem'
          print('🤖 [AI Agent]: Exporting upload_certificate.pem for Play Console...')
          pem_cmd = [
              'keytool', '-export', '-rfc',
              '-keystore', keystore_path,
              '-alias', alias,
              '-file', pem_path,
              '-storepass', store_pass
          ]
          subprocess.run(pem_cmd, check=True)

          # 5. كتابة ملفات key.properties
          key_props = f'''storePassword={store_pass}
          keyPassword={store_pass}
          keyAlias={alias}
          storeFile=upload-keystore.jks
          '''
          
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # 6. حقن وتثبيت اسم الحزمة الصحيح والإعدادات والتوقيع بأمان تام
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              # ضمان توحيد اسم الحزمة بدقة مطابقة لمتطلبات المتجر
              target_app_id = 'com.ibrahim.theater2028.academy99'
              if 'applicationId' in content:
                  content = re.sub(r'applicationId\s+\".*?\"', f'applicationId \"{target_app_id}\"', content)
                  content = re.sub(r'applicationId\s+\'.*?\'', f'applicationId \"{target_app_id}\"', content)
              else:
                  content = content.replace('defaultConfig {', f'defaultConfig {{\n        applicationId \"{target_app_id}\"', 1)

              if 'signingConfigs {' not in content:
                  signing_block = f'''
                  android {{
                      signingConfigs {{
                          release {{
                              storeFile file('upload-keystore.jks')
                              storePassword '{store_pass}'
                              keyAlias '{alias}'
                              keyPassword '{store_pass}'
                          }}
                      }}
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              # ضبط minSdkVersion إلى 24
              if 'minSdkVersion' in content:
                  content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
              else:
                content = content.replace('defaultConfig {', 'defaultConfig {\n        minSdkVersion 24', 1)

              # ضبط targetSdkVersion إلى 36 بالشكل الصحيح
              if 'targetSdkVersion' in content:
                  content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', content)
              else:
                content = content.replace('defaultConfig {', 'defaultConfig {\n        targetSdkVersion 36', 1)

              # ضبط compileSdkVersion إلى 36 بالشكل الصحيح داخل android block
              if 'compileSdkVersion' in content:
                  content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
              elif 'compileSdk ' in content:
                  content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
              else:
                  content = content.replace('android {', 'android {\n    compileSdkVersion 36', 1)

              with open(gradle_path, 'w') as f:
                  f.write(content)

          print('🤖 [AI Agent]: Safe SDK 36 and correct package ID configurations completed successfully.')
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact & PEM Certificate
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-cert
          path: |
            build/app/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          compression-level: 0
