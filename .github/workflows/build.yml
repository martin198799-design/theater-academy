name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cd android
          echo "storeFile=app/upload-keystore.jks" > key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> key.properties

      - name: Inject Signing Config into build.gradle
        run: |
          BUILD_FILE="android/app/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            # حقن إعدادات التوقيع
            sed -i '/android {/a \
                signingConfigs {\
                    release {\
                        storeFile file("app/upload-keystore.jks")\
                        storePassword "${{ secrets.KEYSTORE_PASSWORD }}"\
                        keyAlias "${{ secrets.KEY_ALIAS }}"\
                        keyPassword "${{ secrets.KEYSTORE_PASSWORD }}"\
                    }\
                }' $BUILD_FILE
            # ربط buildTypes
            sed -i 's/buildTypes {/buildTypes {\n    release {\n        signingConfig signingConfigs.release\n    }/' $BUILD_FILE
          fi

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
