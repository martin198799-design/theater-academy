name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Set Version Code to 4 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+4/' pubspec.yaml

      - name: Generate True JKS Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

      - name: Overwrite build.gradle with Guaranteed Signing Config
        run: |
          python3 -c "
          import os
          workspace = os.environ['GITHUB_WORKSPACE']
          keystore_path = os.path.join(workspace, 'android/app/upload-keystore.jks').replace('\\', '/')

          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # إزالة أي buildTypes قديمة وتعويضها بالنسخة المجهزة بالتوقيع الكامل
          signing_config_block = f'''
          signingConfigs {{
              release {{
                  storeFile file(\"{keystore_path}\")
                  storePassword \"123456\"
                  keyAlias \"upload-alias\"
                  keyPassword \"123456\"
                  storeType \"JKS\"
              }}
          }}
          '''

          # حقن الـ signingConfigs مباشرة بعد android {
          if 'signingConfigs' not in content:
              content = content.replace('android {', 'android {\n' + signing_config_block, 1)

          # ربط الـ release بالـ signingConfig
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)

          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
