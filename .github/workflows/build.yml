name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Generate Permanent Stable Keystore & Properties (After Flutter Create)
        run: |
          mkdir -p android/app
          
          # توليد المفتاح الثابت بالمعطيات الصحيحة والموحدة
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass upload123 -keypass upload123 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

          # إنشاء ملف key.properties المتطابق تماماً
          echo "storePassword=upload123" > android/app/key.properties
          echo "keyPassword=upload123" >> android/app/key.properties
          echo "keyAlias=upload" >> android/app/key.properties
          echo "storeFile=upload-keystore.jks" >> android/app/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Android SDK 36 Platform explicitly
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Force API 36 Configurations in Gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' "$BUILD_GRADLE"
            sed -i -E 's/targetSdk[[:space:]]+[0-9]+/targetSdk 36/' "$BUILD_GRADLE"
            sed -i -E 's/minSdk[[:space:]]+[0-9]+/minSdk 24/' "$BUILD_GRADLE"
          fi

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
