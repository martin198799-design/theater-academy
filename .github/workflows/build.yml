name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Template Files (v2)
        run: flutter create . --platforms=android --org com.ibrahim --project-name theater_academy

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Correct Path Inject Signing Config
        run: |
          BUILD_FILE="android/app/build.gradle"
          echo "" >> $BUILD_FILE
          echo "android {" >> $BUILD_FILE
          echo "    signingConfigs {" >> $BUILD_FILE
          echo "        release {" >> $BUILD_FILE
          echo "            storeFile file('upload-keystore.jks')" >> $BUILD_FILE
          echo "            storePassword '${{ secrets.KEYSTORE_PASSWORD }}'" >> $BUILD_FILE
          echo "keyAlias '${{ secrets.KEY_ALIAS }}'" >> $BUILD_FILE
          echo "            keyPassword '${{ secrets.KEYSTORE_PASSWORD }}'" >> $BUILD_FILE
          echo "        }" >> $BUILD_FILE
          echo "    }" >> $BUILD_FILE
          echo "    buildTypes {" >> $BUILD_FILE
          echo "        release {" >> $BUILD_FILE
          echo "            signingConfig signingConfigs.release" >> $BUILD_FILE
          echo "        }" >> $BUILD_FILE
          echo "    }" >> $BUILD_FILE
          echo "}" >> $BUILD_FILE

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
