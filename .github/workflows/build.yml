name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Set Version Code to 4 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+4/' pubspec.yaml

      - name: Generate Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

      - name: Create key.properties File
        run: |
          cat << 'EOF' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload-alias
          storeFile=upload-keystore.jks
          EOF

      - name: Configure signingConfigs in build.gradle safely
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # إضافة إعدادات التوقيع بربطها مع key.properties بالطريقة الرسمية لفلاتر
          signing_snippet = '''
          android {
              signingConfigs {
                  release {
                      if (project.hasProperty('myKeyProps')) {
                          // سيتم القراءة تلقائيا
                      }
                  }
              }
          '''
          
          # تعديل الـ buildTypes لربط الـ release بالتوقيع القياسي
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)

          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
