name: Autonomous Build & Sign Agent - From Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install Android SDK Platform 36
        run: |
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Complete Setup, Application ID, Keystore, PEM & API 36
        run: |
          python3 -c "
          import os
          import subprocess
          import shutil
          import re

          print('🤖 [AI AGENT]: INITIALIZING CLEAN BUILD AND FORCING API 36...')

          # 1. ضبط رقم الإصدار ليصبح 40 لتجنب التعارض
          pubspec_path = 'pubspec.yaml'
          if os.path.exists(pubspec_path):
              with open(pubspec_path, 'r') as f:
                  pub_content = f.read()
              
              if 'version:' in pub_content:
                  pub_content = re.sub(r'version:\s+.*', 'version: 1.0.40+40', pub_content)
              
              with open(pubspec_path, 'w') as f:
                  f.write(pub_content)
              print('🤖 [AI AGENT]: VERSION LOCKED TO 1.0.40+40.')

          # 2. التأكد من سلامة هيكل أندرويد بمعرف الحزمة الصحيح للمتجر
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              print('🤖 [AI AGENT]: RECREATING CLEAN MODERN ANDROID V2 TEMPLATE...')
              if os.path.exists('android'):
                  shutil.rmtree('android')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim.theater2028', '--project-name', 'academy99'], check=True)

          # 3. توليد مفتاح التوقيع الدائم والثابت
          os.makedirs('android/app', exist_ok=True)
          keystore_path = 'android/app/upload-keystore.jks'
          
          store_pass = 'theatre_arts_secure_2026'
          alias = 'upload'

          if not os.path.exists(keystore_path):
              print('🤖 [AI AGENT]: GENERATING PERMANENT SIGNING KEYSTORE...')
              cmd = [
                  'keytool', '-genkey', '-v',
                  '-keystore', keystore_path,
                  '-alias', alias,
                  '-keyalg', 'RSA',
                  '-keysize', '2048',
                  '-validity', '10000',
                  '-storepass', store_pass,
                  '-keypass', store_pass,
                  '-dname', 'CN=Ibrahim, OU=TheatreArts, O=Ibrahim, L=Nasiriyah, C=IQ'
              ]
              subprocess.run(cmd, check=True)
          else:
              print('🤖 [AI AGENT]: KEYSTORE ALREADY EXISTS. PRESERVING IT SAFELY.')

          # 4. استخراج شهادة الـ PEM المطلوبة لمتجر جوجل بلاي تلقائياً
          pem_path = 'upload_certificate.pem'
          print('🤖 [AI AGENT]: EXPORTING UPLOAD_CERTIFICATE.PEM FOR PLAY CONSOLE...')
          pem_cmd = [
              'keytool', '-export', '-rfc',
              '-keystore', keystore_path,
              '-alias', alias,
              '-file', pem_path,
              '-storepass', store_pass
          ]
          subprocess.run(pem_cmd, check=True)

          # 5. كتابة ملفات key.properties
          key_props = f'''storePassword={store_pass}
          keyPassword={store_pass}
          keyAlias={alias}
          storeFile=upload-keystore.jks
          '''
          
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # 6. حقن وتثبيت اسم الحزمة وإجبار API 36 بشكل قاطع
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              # توحيد اسم الحزمة
              target_app_id = 'com.ibrahim.theater2028.academy99'
              if 'applicationId' in content:
                  content = re.sub(r'applicationId\s+\".*?\"', f'applicationId \"{target_app_id}\"', content)
                  content = re.sub(r'applicationId\s+\'.*?\'', f'applicationId \"{target_app_id}\"', content)
              else:
                  content = content.replace('defaultConfig {', f'defaultConfig {{\n        applicationId \"{target_app_id}\"', 1)

              # إعدادات التوقيع
              if 'signingConfigs {' not in content:
                  signing_block = f'''
                  android {{
                      signingConfigs {{
                          release {{
                              storeFile file('upload-keystore.jks')
                              storePassword '{store_pass}'
                              keyAlias '{alias}'
                              keyPassword '{store_pass}'
                          }}
                      }}
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              # فرض minSdkVersion 24
              content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)

              # فرض targetSdkVersion 36 واستبدال متغيرات فلاتر
              content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 36', content)
              content = re.sub(r'targetSdk\s+.*', 'targetSdk 36', content)
              content = content.replace('flutter.targetSdkVersion', '36')

              # فرض compileSdkVersion 36 واستبدال متغيرات فلاتر
              content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 36', content)
              content = re.sub(r'compileSdk\s+.*', 'compileSdk 36', content)
              content = content.replace('flutter.compileSdkVersion', '36')

              with open(gradle_path, 'w') as f:
                  f.write(content)

          print('🤖 [AI AGENT]: API 36 FORCED SUCCESSFULLY IN BUILD.GRADLE.')
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact & PEM Certificate
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-cert
          path: |
            build/app/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          compression-level: 0
