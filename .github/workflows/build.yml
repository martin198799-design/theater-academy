name: Autonomous Build & Sign Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Clean & Recreate Modern Android Template
        run: |
          python3 -c "
          import os
          import subprocess
          import shutil

          print('🤖 [AI Agent]: Checking Android project structure...')

          # إذا كان مجلد android قديماً أو ناقصاً، نقوم بإزالته وإعادة إنشائه بالمعايير الحديثة v2
          if os.path.exists('android'):
              if not os.path.exists('android/app/src/main/AndroidManifest.xml'):
                  print('🤖 [AI Agent]: Found incomplete Android folder. Recreating clean template...')
                  shutil.rmtree('android')

          if not os.path.exists('android'):
              print('🤖 [AI Agent]: Generating fresh Android v2 template...')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim', '--project-name', 'theatre_arts'], check=True)

          # التأكد من وجود مجلد app والتوقيع
          os.makedirs('android/app', exist_ok=True)

          # كتابة ملف key.properties
          key_props = f'''storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}
          keyPassword={os.environ.get('KEYSTORE_PASSWORD', '')}
          keyAlias={os.environ.get('KEY_ALIAS', '')}
          storeFile=upload-keystore.jks
          '''
          
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # ضبط build.gradle للإصدار الموقّع
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              if 'signingConfigs {' not in content:
                  signing_block = '''
                  android {
                      signingConfigs {
                          release {
                              storeFile file('upload-keystore.jks')
                              storePassword \x27''' + os.environ.get('KEYSTORE_PASSWORD', '') + '''\x27
                              keyAlias \x27''' + os.environ.get('KEY_ALIAS', '') + '''\x27
                              keyPassword \x27''' + os.environ.get('KEYSTORE_PASSWORD', '') + '''\x27
                          }
                      }
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              with open(gradle_path, 'w') as f:
                  f.write(content)

          print('🤖 [AI Agent]: Setup and modern embedding verification completed successfully.')
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
