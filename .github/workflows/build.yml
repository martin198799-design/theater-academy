name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Set Version Code to 4 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+4/' pubspec.yaml

      - name: Create Permanent Stable KeyStore and key.properties
        run: |
          mkdir -p android/app
          
          # توليد مفتاح التوقيع الثابت بالمعطيات الثابتة تماماً
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

          # إنشاء ملف key.properties بالمسار والبيانات القياسية الدقيقة
          echo "storePassword=123456" > android/key.properties
          echo "keyPassword=123456" >> android/key.properties
          echo "keyAlias=upload-alias" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
