name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Android SDK 36 explicitly
        run: |
          echo "y" | sudo /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Configure SDK Versions (Compile 34, Target 36, Min 24)
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # ضبط الأرقام الثلاثة بالشكل السليم والصحيح تماماً
          sed -i -E 's/compileSdk(Version)?[[:space:]]*[= ]+[a-zA-Z0-9_.]+/compileSdk = 34/' "$BUILD_GRADLE"
          sed -i -E 's/targetSdk(Version)?[[:space:]]*[= ]+[a-zA-Z0-9_.]+/targetSdk = 36/' "$BUILD_GRADLE"
          sed -i -E 's/minSdk(Version)?[[:space:]]*[= ]+[a-zA-Z0-9_.]+/minSdk = 24/' "$BUILD_GRADLE"
          
          echo "Final SDK Check:"
          grep -nE 'compileSdk|targetSdk|minSdk' "$BUILD_GRADLE"

      - name: Generate Fixed Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-alias -storepass ibrahim123 -keypass ibrahim123 -dname "CN=Ibrahim, O=Theater, C=IQ"
          printf "storePassword=ibrahim123\nkeyPassword=ibrahim123\nkeyAlias=upload-alias\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Inject Signing Config into Build Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'ibrahim123'
                      keyAlias 'upload-alias'
                      keyPassword 'ibrahim123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
