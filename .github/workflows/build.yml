name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Set Version Code to 4 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+4/' pubspec.yaml

      - name: Generate Keystore & Directly Configure Gradle Signing
        run: |
          mkdir -p android/app
          
          # 1. توليد مفتاح التوقيع الثابت بالمعطيات الثابتة
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

          # 2. حقن إعدادات التوقيع برمجياً مباشرة داخل build.gradle لتجنب مشاكل المسارات تماماً
          python3 -c '
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              lines = f.readlines()

          new_lines = []
          signing_added = False
          release_signed = False

          for line in lines:
              if "buildTypes {" and not signing_added:
                  new_lines.append("    signingConfigs {\n")
                  new_lines.append("        release {\n")
                  new_lines.append("            storeFile file(\"upload-keystore.jks\")\n")
                  new_lines.append("            storePassword \"123456\"\n")
                  new_lines.append("            keyAlias \"upload-alias\"\n")
                  new_lines.append("            keyPassword \"123456\"\n")
                  new_lines.append("        }\n")
                  new_lines.append("    }\n")
                  signing_added = True
              
              new_lines.append(line)
              
              if "release {" in line and not release_signed:
                  new_lines.append("            signingConfig signingConfigs.release\n")
                  release_signed = True

          with open(path, "w") as f:
              f.writelines(new_lines)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
