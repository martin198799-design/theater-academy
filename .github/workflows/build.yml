name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Upgrade Gradle Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater --project-name academy

      - name: Install Dependencies
        run: flutter pub get

      - name: Update minSdk to 24 and Force SDK 36
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle || true
          echo "android { compileSdk 36 }" >> android/app/build.gradle
          echo "android { defaultConfig { targetSdk 36 } }" >> android/app/build.gradle

      - name: Generate Fixed Release Keystore
        run: |
          mkdir -p android/app
          # استخدام مفتاح ثابت ومحدد تماماً لضمان مطابقة البصمة
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-alias -storepass ibrahim123 -keypass ibrahim123 -dname "CN=Ibrahim, O=Theater, C=IQ"
          printf "storePassword=ibrahim123\nkeyPassword=ibrahim123\nkeyAlias=upload-alias\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Inject Signing Config into Build Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'ibrahim123'
                      keyAlias 'upload-alias'
                      keyPassword 'ibrahim123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
