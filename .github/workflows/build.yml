name: Autonomous Build & Sign Agent - From Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          cache: true

      - name: Clean & Install Android SDK Platform 36 and Build-Tools 36.0.0
        run: |
          set -e
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          rm -rf "${ANDROID_SDK_ROOT}/platforms/android-36"

          SDKMANAGER=""
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools/temp"
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            mv "${ANDROID_SDK_ROOT}/cmdline-tools/temp/cmdline-tools/"* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"
            rm -rf /tmp/cmdtools.zip "${ANDROID_SDK_ROOT}/cmdline-tools/temp"
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          JAR_PATH="${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
          test -s "$JAR_PATH"
          unzip -t "$JAR_PATH" > /dev/null
          echo "Verified valid android-36/android.jar ($(du -h "$JAR_PATH" | cut -f1))"

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Configure v1.0.47+47 & API 36
        run: |
          python3 -c "
          import os
          import subprocess
          import shutil
          import re

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              if os.path.exists('android'):
                  shutil.rmtree('android')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim.theater2028', '--project-name', 'academy99'], check=True)

          pubspec_path = 'pubspec.yaml'
          if os.path.exists(pubspec_path):
              with open(pubspec_path, 'r') as f:
                  pub_content = f.read()
              if 'version:' in pub_content:
                  pub_content = re.sub(r'version:\s+.*', 'version: 1.0.47+47', pub_content)
              with open(pubspec_path, 'w') as f:
                  f.write(pub_content)

          os.makedirs('android/app', exist_ok=True)
          keystore_path = 'android/app/upload-keystore.jks'
          store_pass = 'theatre_arts_secure_2026'
          alias = 'upload'

          if not os.path.exists(keystore_path):
              cmd = [
                  'keytool', '-genkey', '-v',
                  '-keystore', keystore_path,
                  '-alias', alias,
                  '-keyalg', 'RSA',
                  '-keysize', '2048',
                  '-validity', '10000',
                  '-storepass', store_pass,
                  '-keypass', store_pass,
                  '-dname', 'CN=Ibrahim, OU=TheatreArts, O=Ibrahim, L=Nasiriyah, C=IQ'
              ]
              subprocess.run(cmd, check=True)

          pem_path = 'upload_certificate.pem'
          pem_cmd = [
              'keytool', '-export', '-rfc',
              '-keystore', keystore_path,
              '-alias', alias,
              '-file', pem_path,
              '-storepass', store_pass
          ]
          subprocess.run(pem_cmd, check=True)

          key_props = f'''storePassword={store_pass}
          keyPassword={store_pass}
          keyAlias={alias}
          storeFile=upload-keystore.jks
          '''
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              target_app_id = 'com.ibrahim.theater2028.academy99'
              content = re.sub(r'applicationId\s+\".*?\"', f'applicationId \"{target_app_id}\"', content)
              content = re.sub(r'applicationId\s+\'.*?\'', f'applicationId \"{target_app_id}\"', content)

              if 'signingConfigs {' not in content:
                  signing_block = f'''
                  android {{
                      signingConfigs {{
                          release {{
                              storeFile file('upload-keystore.jks')
                              storePassword '{store_pass}'
                              keyAlias '{alias}'
                              keyPassword '{store_pass}'
                          }}
                      }}
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              # إزالة أي minSdkVersion خاطئ داخل كتلة flutter
              flutter_block_match = re.search(r'(flutter\s*\{)(.*?)(\n\})', content, flags=re.DOTALL)
              if flutter_block_match:
                  f_head, f_body, f_tail = flutter_block_match.groups()
                  f_body = re.sub(r'^\s*minSdkVersion.*$', '', f_body, flags=re.MULTILINE)
                  if re.search(r'\bminSdk\b', f_body):
                      f_body = re.sub(r'(\bminSdk\s*=?\s*)[^\s\r\n]+', r'\g<1>24', f_body)
                  else:
                      f_body += '\n    minSdk = 24'
                  content = content[:flutter_block_match.start()] + f_head + f_body + f_tail + content[flutter_block_match.end():]

              # ضبط minSdkVersion / targetSdkVersion / compileSdkVersion في بقية الملف (مثل defaultConfig و android)
              content = re.sub(r'(\bminSdkVersion\s*=?\s*)[^\s\r\n]+', r'\g<1>24', content)
              content = re.sub(r'(\btargetSdkVersion\s*=?\s*)[^\s\r\n]+', r'\g<1>36', content)
              content = re.sub(r'(\btargetSdk\s*=?\s*)[^\s\r\n]+', r'\g<1>36', content)
              content = content.replace('flutter.targetSdkVersion', '36')

              content = re.sub(r'(\bcompileSdkVersion\s*=?\s*)[^\s\r\n]+', r'\g<1>36', content)
              content = re.sub(r'(\bcompileSdk\s*=?\s*)[^\s\r\n]+', r'\g<1>36', content)
              content = content.replace('flutter.compileSdkVersion', '36')

              with open(gradle_path, 'w') as f:
                  f.write(content)
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact & PEM Certificate
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-cert
          path: |
            build/app/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          compression-level: 0
