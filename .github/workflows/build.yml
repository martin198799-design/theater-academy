name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Upgrade Gradle Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater --project-name academy

      - name: Install Dependencies
        run: flutter pub get

      - name: Update SDK versions safely with Python
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24')
          content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
          content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 36')
          content = content.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36')
          content = content.replace('targetSdk flutter.targetSdkVersion', 'targetSdk 36')
          import re
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', content)
          content = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', content)
          content = re.sub(r'targetSdk\s+\d+', 'targetSdk 36', content)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Generate Fixed Release Keystore
        run: |
          mkdir -p android/app
          # استخدام مفتاح ثابت ومحدد لضمان مطابقة البصمة
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-alias -storepass ibrahim123 -keypass ibrahim123 -dname "CN=Ibrahim, O=Theater, C=IQ"
          printf "storePassword=ibrahim123\nkeyPassword=ibrahim123\nkeyAlias=upload-alias\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Inject Signing Config into Build Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'ibrahim123'
                      keyAlias 'upload-alias'
                      keyPassword 'ibrahim123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
