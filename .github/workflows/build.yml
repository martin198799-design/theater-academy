name: Autonomous Build & Sign Agent - From Scratch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Ensure Modern Android v2 & API 34 Setup
        run: |
          python3 -c "
          import os
          import subprocess
          import re

          print('🤖 [AI TECH AGENT]: CHECKING AND ENSURING MODERN ANDROID V2 STRUCTURE...')

          # 1. التأكد من وجود مجلد أندرويد الحديث v2 بمعرف الحزمة الصحيح
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              print('🤖 [AI TECH AGENT]: Android folder or manifest missing. Recreating clean v2 template...')
              if os.path.exists('android'):
                  import shutil
                  shutil.rmtree('android')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim.theater2028', '--project-name', 'academy99'], check=True)
          else:
              print('🤖 [AI TECH AGENT]: Android v2 structure already exists.')

          # 2. تحديث رقم الإصدار إلى 44
          pubspec_path = 'pubspec.yaml'
          if os.path.exists(pubspec_path):
              with open(pubspec_path, 'r') as f:
                  pub_content = f.read()
              if 'version:' in pub_content:
                  pub_content = re.sub(r'version:\s+.*', 'version: 1.0.44+44', pub_content)
              with open(pubspec_path, 'w') as f:
                  f.write(pub_content)
              print('🤖 [AI TECH AGENT]: Version locked to 1.0.44+44.')

          # 3. توليد مفتاح التوقيع الثابت
          os.makedirs('android/app', exist_ok=True)
          keystore_path = 'android/app/upload-keystore.jks'
          store_pass = 'theatre_arts_secure_2026'
          alias = 'upload'

          if not os.path.exists(keystore_path):
              print('🤖 [AI TECH AGENT]: Generating permanent signing keystore...')
              cmd = [
                  'keytool', '-genkey', '-v',
                  '-keystore', keystore_path,
                  '-alias', alias,
                  '-keyalg', 'RSA',
                  '-keysize', '2048',
                  '-validity', '10000',
                  '-storepass', store_pass,
                  '-keypass', store_pass,
                  '-dname', 'CN=Ibrahim, OU=TheatreArts, O=Ibrahim, L=Nasiriyah, C=IQ'
              ]
              subprocess.run(cmd, check=True)

          # 4. استخراج شهادة PEM للـ Play Console
          pem_path = 'upload_certificate.pem'
          pem_cmd = [
              'keytool', '-export', '-rfc',
              '-keystore', keystore_path,
              '-alias', alias,
              '-file', pem_path,
              '-storepass', store_pass
          ]
          subprocess.run(pem_cmd, check=True)

          # 5. كتابة ملفات key.properties
          key_props = f'''storePassword={store_pass}
          keyPassword={store_pass}
          keyAlias={alias}
          storeFile=upload-keystore.jks
          '''
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # 6. تعديل build.gradle لضبط التطبيق والتوقيع و API 34
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              target_app_id = 'com.ibrahim.theater2028.academy99'
              content = re.sub(r'applicationId\s+\".*?\"', f'applicationId \"{target_app_id}\"', content)
              content = re.sub(r'applicationId\s+\'.*?\'', f'applicationId \"{target_app_id}\"', content)

              if 'signingConfigs {' not in content:
                  signing_block = f'''
                  android {{
                      signingConfigs {{
                          release {{
                              storeFile file('upload-keystore.jks')
                              storePassword '{store_pass}'
                              keyAlias '{alias}'
                              keyPassword '{store_pass}'
                          }}
                      }}
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
              content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 34', content)
              content = re.sub(r'targetSdk\s+.*', 'targetSdk 34', content)
              content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 34', content)
              content = re.sub(r'compileSdk\s+.*', 'compileSdk 34', content)

              with open(gradle_path, 'w') as f:
                  f.write(content)
              print('🤖 [AI TECH AGENT]: Build.gradle successfully configured.')
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact & PEM Certificate
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-cert
          path: |
            build/app/outputs/bundle/release/app-release.aab
            upload_certificate.pem
          compression-level: 0
