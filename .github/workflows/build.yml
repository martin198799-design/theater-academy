name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater.academy2028 --project-name academy99

      - name: Set Version Code to 1 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+1/' pubspec.yaml

      - name: Generate JKS Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

      - name: Create key.properties File
        run: |
          cat << 'EOF' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload-alias
          storeFile=upload-keystore.jks
          EOF

      - name: Update minSdkVersion to 24 and Add Signing Config
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          python3 -c "
          path = '$BUILD_GRADLE'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          import re
          content = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 24', content)
          content = re.sub(r'minSdk\s+.*', 'minSdk 24', content)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "
          
          cat << 'EOF' >> "$BUILD_GRADLE"

          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties.getProperty('keyAlias')
                      keyPassword keystoreProperties.getProperty('keyPassword')
                      storeFile keystoreProperties.getProperty('storeFile') ? file(keystoreProperties.getProperty('storeFile')) : null
                      storePassword keystoreProperties.getProperty('storePassword')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release

      - name: Upload AAB and Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-keystore
          path: |
            build/app/outputs/bundle/release/app-release.aab
            android/app/upload-keystore.jks
