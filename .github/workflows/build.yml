name: AI Autonomous Build & Healing Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Keystore & Error Healing Guard
        run: |
          python3 -c "
          import os
          import subprocess

          print('🤖 [AI Agent]: Starting autonomous environment inspection...')

          # 1. التأكد من وجود الهيكل أو إنشاؤه بحذر دون المساس ببصمة التوقيع أو اسم الحزمة
          if not os.path.exists('android'):
              print('🤖 [AI Agent]: Generating clean Android template...')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim', '--project-name', 'theatre_arts'], check=True)

          # 2. حراسة المفتاح الأصلي: فك تشفير المفتاح الحقيقي وثباته
          os.makedirs('android/app', exist_ok=True)
          keystore_base64 = os.environ.get('KEYSTORE_BASE64', '')
          keystore_path = 'android/app/upload-keystore.jks'
          
          if keystore_base64:
              print('🤖 [AI Agent]: Restoring original permanent signing keystore...')
              import base64
              with open(keystore_path, 'wb') as f:
                  f.write(base64.b64decode(keystore_base64))
          else:
              print('🤖 [AI Agent Warning]: Keystore secret is empty, checking local existence...')

          # 3. إنشاء ملف key.properties بالمعلومات الثابتة مدى الحياة
          key_props = f'''storePassword={os.environ.get('KEYSTORE_PASSWORD', '')}
          keyPassword={os.environ.get('KEYSTORE_PASSWORD', '')}
          keyAlias={os.environ.get('KEY_ALIAS', '')}
          storeFile=upload-keystore.jks
          '''
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          
          # نسخ الاحتياط داخل مجلد app لضمان توافقه التام مع كل إصدارات Gradle
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # 4. الإصلاح الذاتي لملف build.gradle وتوجيهه قسراً للإصدار الموقع حصرياً
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  gradle_content = f.read()

              # التحقق من وجود إعدادات التوقيع وحقنها إذا كانت مفقودة
              if 'signingConfigs {' not in gradle_content:
                  print('🤖 [AI Agent]: Self-healing build.gradle - Injecting permanent signing config...')
                  signing_block = '''
                  android {
                      signingConfigs {
                          release {
                              storeFile file('upload-keystore.jks')
                              storePassword \x27''' + os.environ.get('KEYSTORE_PASSWORD', '') + '''\x27
                              keyAlias \x27''' + os.environ.get('KEY_ALIAS', '') + '''\x27
                              keyPassword \x27''' + os.environ.get('KEY_PASSWORD', '') + '''\x27
                          }
                      }
                  '''
                  gradle_content = gradle_content.replace('android {', signing_block, 1)

              # إجبار وضع الرفع على استخدام مفتاح الإصدار الأصلي حصرياً
              if 'signingConfig signingConfigs.debug' in gradle_content:
                  print('🤖 [AI Agent]: Fixing debug-sign vulnerability -> Switching to permanent release key...')
                  gradle_content = gradle_content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              with open(gradle_path, 'w') as f:
                  f.write(gradle_content)

          print('🤖 [AI Agent]: Inspection and healing completed successfully. Ready for compilation.')
          "

      - name: Build Official Release App Bundle (Autonomous Execution)
        run: |
          echo "🚀 Initiating Flutter Release Bundle Build..."
          flutter build appbundle --release

      - name: Upload Verified Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
