name: Autonomous Build & Sign Agent

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  autonomous_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: AI Technical Agent - Modern Android & Keystore Auto-Fixer
        run: |
          python3 -c "
          import os
          import subprocess
          import shutil

          print('🤖 [AI Agent]: Inspecting Android project structure...')

          # التأكد من وجود هيكل أندرويد حديث ومتكامل v2
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if not os.path.exists(manifest_path):
              print('🤖 [AI Agent]: Android manifest missing or outdated. Recreating clean modern Android v2 template...')
              if os.path.exists('android'):
                  shutil.rmtree('android')
              subprocess.run(['flutter', 'create', '.', '--platforms=android', '--org', 'com.ibrahim', '--project-name', 'theatre_arts'], check=True)

          # تأمين وتوليد مفتاح التوقيع الدائم والثابت مدى الحياة
          os.makedirs('android/app', exist_ok=True)
          keystore_path = 'android/app/upload-keystore.jks'
          
          store_pass = 'theatre_arts_secure_2026'
          alias = 'upload'

          if not os.path.exists(keystore_path):
              print('🤖 [AI Agent]: Generating permanent signing keystore...')
              cmd = [
                  'keytool', '-genkey', '-v',
                  '-keystore', keystore_path,
                  '-alias', alias,
                  '-keyalg', 'RSA',
                  '-keysize', '2048',
                  '-validity', '10000',
                  '-storepass', store_pass,
                  '-keypass', store_pass,
                  '-dname', 'CN=Ibrahim, OU=TheatreArts, O=Ibrahim, L=Nasiriyah, C=IQ'
              ]
              subprocess.run(cmd, check=True)
          else:
              print('🤖 [AI Agent]: Permanent keystore already exists. Preserving it safely.')

          # كتابة ملف key.properties
          key_props = f'''storePassword={store_pass}
          keyPassword={store_pass}
          keyAlias={alias}
          storeFile=upload-keystore.jks
          '''
          
          with open('android/key.properties', 'w') as f:
              f.write(key_props)
          
          with open('android/app/key.properties', 'w') as f:
              f.write(key_props)

          # حقن وتعديل build.gradle لضمان التوقيع السليم
          gradle_path = 'android/app/build.gradle'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r') as f:
                  content = f.read()

              if 'signingConfigs {' not in content:
                  signing_block = f'''
                  android {{
                      signingConfigs {{
                          release {{
                              storeFile file('upload-keystore.jks')
                              storePassword '{store_pass}'
                              keyAlias '{alias}'
                              keyPassword '{store_pass}'
                          }}
                      }}
                  '''
                  content = content.replace('android {', signing_block, 1)

              if 'signingConfig signingConfigs.debug' in content:
                  content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

              with open(gradle_path, 'w') as f:
                  f.write(content)

          print('🤖 [AI Agent]: All verifications passed successfully. Ready to build.')
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload Verified Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
