name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Upgrade Gradle Structure and Create Android
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy

      - name: Install Dependencies
        run: flutter pub get

      - name: Fix Package Name and API 36 in build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # تغيير اسم الحزمة بالكامل لتطبيق جديد
          sed -i 's/applicationId ".*"/applicationId "com.ibrahim.theater2028.academy"/g' $BUILD_GRADLE
          
          # تعديل أرقام الإصدارات بالطريقة السليمة داخل ملف الـ gradle
          sed -i 's/minSdk = .*/minSdk = 24/g' $BUILD_GRADLE || true
          sed -i 's/targetSdk = .*/targetSdk = 36/g' $BUILD_GRADLE || true
          sed -i 's/compileSdk = .*/compileSdk = 36/g' $BUILD_GRADLE || true
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' $BUILD_GRADLE || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' $BUILD_GRADLE || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' $BUILD_GRADLE || true

      - name: Generate Fixed Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-alias -storepass ibrahim123 -keypass ibrahim123 -dname "CN=Ibrahim, O=Theater, C=IQ"
          printf "storePassword=ibrahim123\nkeyPassword=ibrahim123\nkeyAlias=upload-alias\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Inject Signing Config into Build Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'ibrahim123'
                      keyAlias 'upload-alias'
                      keyPassword 'ibrahim123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
