name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android Template
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.ibrahim --project-name theatre_arts
          fi

      - name: Create key.properties
        run: |
          mkdir -p android/app
          cd android
          cat << 'EOF' > key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Force True Release Signing in build.gradle
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          signing_configs_block = '''
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword '${{ secrets.KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.KEY_ALIAS }}'
                      keyPassword '${{ secrets.KEYSTORE_PASSWORD }}'
                  }
              }
          '''

          # حقن إعدادات التوقيع بعد كلمة android {
          content = content.replace('android {', 'android {' + signing_configs_block, 1)

          # تغيير توقيع الـ debug إلى release قسراً
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build Official Release App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          compression-level: 0
