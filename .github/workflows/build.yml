name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Generate Fresh Android Structure
        run: flutter create . --platforms=android --org com.ibrahim.theater2028 --project-name academy99

      - name: Set Version Code to 4 in pubspec.yaml
        run: |
          sed -i 's/version: .*/version: 1.0.0+4/' pubspec.yaml

      - name: Generate JKS Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload-alias \
            -storepass 123456 -keypass 123456 \
            -dname "CN=Ibrahim, O=Theater, C=IQ"

      - name: Create key.properties File
        run: |
          cat << 'EOF' > android/key.properties
          storePassword=123456
          keyPassword=123456
          keyAlias=upload-alias
          storeFile=upload-keystore.jks
          EOF

      - name: Configure signing in app build.gradle
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          python3 -c "
          path = '$BUILD_GRADLE'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Add signingConfigs inside android block
          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file(\"upload-keystore.jks\")
                      storePassword \"123456\"
                      keyAlias \"upload-alias\"
                      keyPassword \"123456\"
                  }
              }
          '''
          if 'signingConfigs' not in content:
              content = content.replace('android {', 'android {' + signing_config, 1)

          # Add signingConfig to release build type
          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('release {', 'release {\n\t\t\tsigningConfig signingConfigs.release', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build App Bundle Release
        run: flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
