name: Build Android Release AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Upgrade Gradle Structure and Create Android
        run: flutter create . --platforms=android --org com.ibrahim.theater2027 --project-name academy

      - name: Install Android SDK 36 Tools
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Manual Fix build.gradle for SDK 36 and New Package ID
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # تعديل اسم الحزمة مباشرة لضمان عدم التعارض
          sed -i 's/applicationId ".*"/applicationId "com.ibrahim.theater2027.academy"/g' $BUILD_GRADLE
          
          # فرض الإصدارات 36 بوضوح وتثبيت إصدار الـ buildToolsVersion على 36.0.0
          sed -i 's/minSdkVersion.*/minSdkVersion 24/g' $BUILD_GRADLE
          sed -i 's/targetSdkVersion.*/targetSdkVersion 36/g' $BUILD_GRADLE
          sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' $BUILD_GRADLE
          sed -i 's/targetSdk.*/targetSdk 36/g' $BUILD_GRADLE
          sed -i 's/compileSdk.*/compileSdk 36/g' $BUILD_GRADLE
          
          # إضافة buildToolsVersion صراحة داخل كتلة android إذا لمواجهة أي أدوات قديمة
          if ! grep -q "buildToolsVersion" $BUILD_GRADLE; then
            sed -i '/defaultConfig {/a \    buildToolsVersion "36.0.0"' $BUILD_GRADLE
          fi

      - name: Generate Fixed Release Keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-alias -storepass ibrahim123 -keypass ibrahim123 -dname "CN=Ibrahim, O=Theater, C=IQ"
          printf "storePassword=ibrahim123\nkeyPassword=ibrahim123\nkeyAlias=upload-alias\nstoreFile=upload-keystore.jks\n" > android/key.properties

      - name: Inject Signing Config into Build Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword 'ibrahim123'
                      keyAlias 'upload-alias'
                      keyPassword 'ibrahim123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build App Bundle Release
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
